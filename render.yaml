databases:
  - name: helpdesk-datacenter-db
    databaseName: helpdesk
    user: helpdesk
    plan: free
    region: oregon

services:
  - type: web
    name: helpdesk-datacenter-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /tickets
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: helpdesk-datacenter-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: helpdesk-datacenter-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: helpdesk-datacenter-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: helpdesk-datacenter-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: helpdesk-datacenter-db
          property: password
      - key: SPRING_SECURITY_USER_NAME
        sync: false
      - key: SPRING_SECURITY_USER_PASSWORD
        sync: false
      # URL pública del frontend en Vercel (Actividad 9).
      - key: CORS_ALLOWED_ORIGINS
        value: https://helpdesk-datacenter-blush.vercel.app
      # Render espera que los servicios Docker escuchen en el puerto 10000
      # (es el puerto que usa internamente para el healthcheck/proxy),
      # independientemente de EXPOSE en el Dockerfile.
      - key: PORT
        value: 10000

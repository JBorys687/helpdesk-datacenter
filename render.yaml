databases:
  - name: helpdesk-datacenter-db
    databaseName: helpdesk
    user: helpdesk
    plan: free
    region: oregon

services:
  - type: web
    name: helpdesk-datacenter-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /tickets
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: helpdesk-datacenter-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: helpdesk-datacenter-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: helpdesk-datacenter-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: helpdesk-datacenter-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: helpdesk-datacenter-db
          property: password
      - key: SPRING_SECURITY_USER_NAME
        sync: false
      - key: SPRING_SECURITY_USER_PASSWORD
        sync: false
      # URL pública del frontend en Vercel (Actividad 9).
      - key: CORS_ALLOWED_ORIGINS
        value: https://helpdesk-datacenter-blush.vercel.app
      # No fijar PORT: Render inyecta su propio valor (normalmente 10000) y
      # espera que el servicio escuche exactamente ahí; application.yml ya
      # respeta ${PORT} automáticamente. Fijarlo aquí rompe el healthcheck.

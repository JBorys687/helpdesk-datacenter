spring:
  application:
    name: helpdesk-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DATABASE_USER:helpdesk}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    mapper:
      accept-case-insensitive-enums: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
